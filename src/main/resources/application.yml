spring:
  application:
    name: revente-backend
  profiles:
    active: dev
  flyway:
    baseline-on-migrate: true

firebase:
  api-key: ${FIREBASE_API_KEY}
  otp:
    mock-mode: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/revente?stringtype=unspecified
    username: revente_user
    password: revente_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
