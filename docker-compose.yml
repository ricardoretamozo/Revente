services:
  postgres:
    image: postgres:16-alpine
    container_name: revente_db
    environment:
      POSTGRES_DB: revente
      POSTGRES_USER: revente_user
      POSTGRES_PASSWORD: revente_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: revente_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/revente
      SPRING_DATASOURCE_USERNAME: revente_user
      SPRING_DATASOURCE_PASSWORD: revente_password
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
    depends_on:
      - postgres

volumes:
  postgres_data:
